# /etc/systemd/system/caddy.service.d/ripple.conf (C2 track P; docs/plan/hosting.md 5.6 item 6, 5.9).
# Caddy gets the origin lock from /etc/caddy/edge.env (written by push-secrets, 0600 root) and does not start without a
# usable one: with the file missing systemd refuses to start the unit, and with a missing or short EDGE_SECRET the
# check below fails. An empty value would turn {$EDGE_SECRET} into an empty string and leave the origin open.
#
# The packaged unit starts Caddy with --environ, which prints the whole environment into the journal at every start:
# the origin lock would be readable there. The two ExecStart lines replace that command with the same one without it.
[Service]
EnvironmentFile=/etc/caddy/edge.env
ExecStartPre=/usr/local/lib/ripple/check-edge-secret.sh
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
