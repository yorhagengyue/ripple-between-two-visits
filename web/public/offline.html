<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="rp-shell" content="1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F2F5F9" />
    <title>Ripple</title>
    <!--
      The offline shell (C2 track O; real-app 2.25). The only thing Ripple's service worker caches (public/sw-offline.js),
      shown in place of a page when a navigation finds no network. It is the same for everyone: no name, no medicine, no
      reading, nothing fetched. Its script reads two things the phone itself keeps (lib/offline/client.ts): how many
      entries of the to-send list wait for the account last seen on this phone (a count, never their contents) and the
      language cookie. It goes back to the page he asked for as soon as the network answers.

      The look is the elder side's timeline design (front-end line fe-12; the draft's 通用-3 「没网」): the cool paper
      ground, 「Ripple」 as the screen's title, the sentence in a grey box, what waits on this phone in a white box with the
      hairline, and the one filled button, 72 high, under them. A static file carries its own styles and no web font, so
      the values are the design's own, written out, and the sizes are in rem (1rem = 16 design px) so they follow the
      phone's text size: nothing under 18px. On a computer it is the same 430px column the app's phone pages are.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f2f5f9;
        color: #18202c;
        font-family: "Noto Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.45;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-content: start;
        gap: 1.125rem;
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 26.875rem;
        margin: 0 auto;
        padding: 0.25rem 1.25rem 2.5rem;
        background: #f2f5f9;
      }
      .brand {
        margin: 0.5rem 0 0;
        font-size: 2.25rem;
        line-height: 1.2;
        font-weight: 900;
      }
      .box {
        display: grid;
        gap: 0.375rem;
        padding: 1rem 1.125rem;
        border-radius: 1rem;
        background: #e1e7ee;
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
        line-height: 1.4;
        font-weight: 800;
      }
      .say {
        margin: 0;
        font-size: 1.1875rem;
        line-height: 1.55;
        color: #2c3644;
      }
      .waiting {
        margin: 0;
        padding: 1rem 1.125rem;
        border: 1px solid #d5dce5;
        border-radius: 1rem;
        background: #ffffff;
        font-size: 1.25rem;
        line-height: 1.5;
        font-weight: 700;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 4.5rem;
        padding: 0.375rem 1rem;
        border: 0;
        border-radius: 1rem;
        background: #6a4c93;
        color: #ffffff;
        font: inherit;
        font-size: 1.625rem;
        line-height: 1.25;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:active {
        background: #4e3672;
      }
      .btn:focus-visible {
        outline: 3px solid #6a4c93;
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      /* on a computer: the phone's column in the middle of a flat ground, as the app's phone pages are */
      @media screen and (min-width: 720px) {
        html,
        body {
          background: #e1e7ee;
        }
        main {
          box-shadow: 0 0 0 1px #d5dce5;
        }
      }
    </style>
  </head>
  <body>
    <main data-rp-side="elder" data-testid="offline-shell">
      <p class="brand" translate="no">Ripple</p>
      <div class="box">
        <h1 id="rp-title">现在没有网络。</h1>
        <p class="say" id="rp-body">连上网以后，这一页会自己打开。</p>
      </div>
      <p class="waiting" id="rp-waiting" data-testid="shell-waiting" role="status" hidden></p>
      <button class="btn" id="rp-again" type="button" data-testid="shell-again">再试一次</button>
    </main>
    <script>
      (function () {
        "use strict";
        var en = /(?:^|;\s*)rp_lang=en(?:;|$)/.test(document.cookie || "");
        var waiting = 0;
        try {
          var owner = window.localStorage.getItem("rp_outbox_owner");
          var list = JSON.parse(window.localStorage.getItem("rp_outbox_v1") || "[]");
          if (owner && Array.isArray(list)) {
            for (var i = 0; i < list.length; i++) {
              if (list[i] && list[i].owner === owner && list[i].state === "waiting") waiting++;
            }
          }
        } catch (e) {
          waiting = 0;
        }
        var w = document.getElementById("rp-waiting");
        if (en) {
          document.documentElement.lang = "en";
          document.getElementById("rp-title").textContent = "No connection right now.";
          document.getElementById("rp-body").textContent = "This page opens by itself once you are back online.";
          document.getElementById("rp-again").textContent = "Try again";
        }
        if (waiting > 0) {
          w.textContent = en
            ? waiting + (waiting === 1 ? " thing you recorded is" : " things you recorded are") + " kept on this phone and will be sent once you are back online."
            : "这台手机上有 " + waiting + " 条已经记下，连上网就发出去。";
          w.setAttribute("data-count", String(waiting));
          w.hidden = false;
        }
        // shown in place of a page, the way back is that page's own address; opened by its own address, it is the app's
        var own = window.location.pathname === "/offline.html";
        var leaving = false;
        function back() {
          if (leaving) return;
          leaving = true;
          if (own) window.location.assign("/");
          else window.location.reload();
        }
        function probe() {
          if (own || leaving || navigator.onLine === false) return;
          fetch("/manifest.webmanifest", { method: "HEAD", cache: "no-store", credentials: "omit" }).then(
            function (res) {
              if (res && res.ok) back();
            },
            function () {},
          );
        }
        document.getElementById("rp-again").addEventListener("click", back);
        window.addEventListener("online", probe);
        window.setInterval(probe, 5000);
      })();
    </script>
  </body>
</html>
